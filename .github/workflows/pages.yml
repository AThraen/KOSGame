# Deploy KØS SEJL to GitHub Pages when a release tag (v*) is pushed, or on demand.
# Release: git tag v0.2.0 && git push origin v0.2.0
# Pages source must be "GitHub Actions" (Settings > Pages); set once via the API.
# Only the shipped game is published (index.html, sw.js, manifest, css/, js/, assets/), never tools/ or docs/.
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # fast, dependency-free checks (the browser suites need Chrome and run locally)
      - name: Core simulation tests
        run: node tools/test-core.js

      # refresh the service worker's precache list + version so the deploy always matches its files
      - name: Generate precache
        run: node tools/gen-precache.js

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

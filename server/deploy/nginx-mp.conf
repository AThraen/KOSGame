# nginx snippet for the KOS live race server.
# Include this INSIDE the existing `server { ... }` block, e.g.:
#   include /etc/nginx/snippets/kos-mp.conf;
#
# The client connects to wss://<host>/mp/ws (test: wss://<host>/mp-test/ws);
# the node server serves the websocket at path /ws and a health endpoint at
# /health. /health is only reachable on 127.0.0.1 and nginx has no location
# exposing it (the explicit 404s below keep it that way).

# Public status files, written by `kos-race` (never cached).
location = /mp-status.json {
    alias /var/www/html/mp-status.json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
}
location = /mp-test-status.json {
    alias /var/www/html/mp-test-status.json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
}

# Production race server (port 8787).
location /mp/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
# Test race server (port 8788).
location /mp-test/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

# /health is loopback-only; never expose it through nginx.
location = /mp/health {
    return 404;
}
location = /mp-test/health {
    return 404;
}
